name: Publish VS Code Extension

on:
  push:
    branches: [ "sacumen-devops-cicd-gitpod-ms" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build extension
      - name: Build extension
        run: npm run build

      # 5️⃣ Run tests
      - name: Run tests
        run: npx jest || echo "No tests found"

      # 6️⃣ Custom Version Bump (x.y.z with y,z ≤ 9)
      - name: Bump version
        id: bump
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(currentVersion) {
            let [x, y, z] = currentVersion.split('.').map(Number);

            z++;
            if (z > 9) { z = 0; y++; }
            if (y > 9) { y = 0; x++; }

            return `${x}.${y}.${z}`;
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const newVersion = bumpVersion(pkg.version);

          pkg.version = newVersion;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

          fs.writeFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`, { flag: "a" });
          EOF

      # 7️⃣ Ensure vsce installed
      - name: Ensure vsce is installed
        run: |
          if ! command -v vsce &> /dev/null; then
            npm install -g @vscode/vsce
          fi

      # 8️⃣ Package extension
      - name: Package extension
        run: vsce package

      # 9️⃣ Check version in BOTH marketplaces


      # 🔟 Publish to Microsoft Marketplace ONLY IF SAFE
      - name: Publish to MS Marketplace
        if: steps.check_all.outputs.can_publish == 'true'
        run: |
          echo "Publishing to Microsoft Marketplace..."
          set +e
          output=$(npx vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }} 2>&1)
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            echo "MS Marketplace: version exists → continuing"
            exit 0
          fi

      # 1️⃣1️⃣ Publish to GitPod (OpenVSX)
      - name: Publish to GitPod Marketplace
        if: steps.check_all.outputs.can_publish == 'true'
        run: |
          echo "Publishing to OpenVSX/GitPod..."
          set +e
          output=$(npx ovsx publish -p ${{ secrets.GITPOD_MARKETPLACE_TOKEN }} 2>&1)
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            echo "OpenVSX: version exists → continuing"
            exit 0
          fi

      # 1️⃣2️⃣ Commit version bump
      - name: Commit and push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}" || echo "No changes"
          git push origin HEAD:${GITHUB_REF_NAME}

      # 1️⃣3️⃣ Upload .vsix
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.bump.outputs.version }}
          path: "*.vsix"
