name: Publish VS Code Extension

on:
  push:
    branches: [ "sacumen-devops-cicd-gitpod-ms" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build extension
      - name: Build extension
        run: npm run build

      # 5️⃣ Run tests
      - name: Run tests
        run: npx jest || echo "No tests found"

      # 6️⃣ Version bump x.y.z
      - name: Bump version
        id: bump
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(currentVersion) {
            let [x, y, z] = currentVersion.split('.').map(Number);
            z++;
            if (z > 9) { z = 0; y++; }
            if (y > 9) { y = 0; x++; }
            return `${x}.${y}.${z}`;
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const newVersion = bumpVersion(pkg.version);
          pkg.version = newVersion;

          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          fs.writeFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`, { flag: "a" });
          EOF

      # 7️⃣ Ensure vsce installed
      - name: Ensure vsce is installed
        run: |
          if ! command -v vsce &> /dev/null; then
            npm install -g @vscode/vsce
          fi

      # 8️⃣ Package extension
      - name: Package extension
        run: vsce package

      # 🔐 Validate Microsoft Marketplace Token (reliable)
      - name: Validate Microsoft Marketplace Token
        run: |
          echo "🔐 Validating Microsoft Marketplace token..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Basic $(printf ":%s" "${{ secrets.VS_MARKETPLACE_TOKEN }}" | base64 -w0)" \
            https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.1)

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ INVALID Microsoft Marketplace Token"
            echo "HTTP CODE: $RESPONSE"
            exit 1
          fi

          echo "✅ Microsoft Marketplace token is valid"

      # 🔐 Validate GitPod/OpenVSX Token (reliable)
      - name: Validate GitPod/OpenVSX Token
        run: |
          echo "🔐 Validating GitPod/OpenVSX token..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITPOD_MARKETPLACE_TOKEN }}" \
            https://open-vsx.org/api/-/whoami)

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ INVALID GitPod/OpenVSX Token"
            echo "HTTP CODE: $RESPONSE"
            exit 1
          fi

          echo "✅ GitPod/OpenVSX token is valid"

      # 9️⃣ Check version in BOTH marketplaces
      - name: Check versions in both Marketplaces
        id: check_version
        run: |
          EXTENSION_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "🔍 Checking extension: $EXTENSION_ID"
          echo "🔍 New version to publish: $VERSION"

          ms_exists=false
          gitpod_exists=false

          echo "📌 Microsoft Marketplace:"
          MS_VERSION=$(npx vsce show $EXTENSION_ID -p "${{ secrets.VS_MARKETPLACE_TOKEN }}" 2>/dev/null | grep "Version:" | awk '{print $2}')
          echo "• MS Marketplace Version = ${MS_VERSION:-none}"

          if [ "$MS_VERSION" = "$VERSION" ]; then
            ms_exists=true
          fi

          echo "📌 GitPod / OpenVSX:"
          GITPOD_VERSION=$(npx ovsx show $EXTENSION_ID -p "${{ secrets.GITPOD_MARKETPLACE_TOKEN }}" 2>/dev/null | grep "Version:" | awk '{print $2}')
          echo "• GitPod Version = ${GITPOD_VERSION:-none}"

          if [ "$GITPOD_VERSION" = "$VERSION" ]; then
            gitpod_exists=true
          fi

          if [ "$ms_exists" = true ] || [ "$gitpod_exists" = true ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⛔ Version already exists — blocking publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✔ Version safe to publish."
          fi

      # 🔟 Publish to Microsoft Marketplace
      - name: Publish to Visual Studio Marketplace
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "Publishing to MS Marketplace..."
          set +e
          output=$(npx vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            exit 1
          fi

          if [ $exit_code -ne 0 ]; then
            exit $exit_code
          fi

      # 1️⃣1️⃣ Publish to GitPod Marketplace
      - name: Publish to GitPod Marketplace
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "⏳ Publishing to GitPod Marketplace..."
          set +e
          output=$(npx ovsx publish -p ${{ secrets.GITPOD_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            exit 1
          fi

          if [ $exit_code -ne 0 ]; then
            echo "❌ GitPod publish failed — aborting to prevent version mismatch."
            exit $exit_code
          fi

      # 1️⃣2️⃣ Commit version bump
      - name: Commit and push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}" || echo "No changes"
          git push origin HEAD:${GITHUB_REF_NAME}

      # 1️⃣3️⃣ Upload artifact
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.bump.outputs.version }}
          path: "*.vsix"
