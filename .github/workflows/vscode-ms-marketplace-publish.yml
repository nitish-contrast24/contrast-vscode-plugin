name: Publish VS Code Extension

on:
  push:
    branches: [ "sacumen-devops-cicd-ms" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build the extension
      - name: Build extension
        run: npm run build

      # 5️⃣ Run tests
      - name: Run tests
        run: npx jest || echo "No tests found, skipping..."

      # 8️⃣ Custom Version Bump (x.y.z with y,z ≤ 9)
      - name: Bump version
        id: bump
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(currentVersion) {
            let [x, y, z] = currentVersion.split('.').map(Number);

            z++;
            if (z > 9) {
              z = 0;
              y++;
            }
            if (y > 9) {
              y = 0;
              x++;
            }

            return `${x}.${y}.${z}`;
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const newVersion = bumpVersion(pkg.version);

          pkg.version = newVersion;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

          console.log("New version:", newVersion);

          fs.writeFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`, { flag: "a" });
          EOF

      # 6️⃣ Ensure vsce is installed
      - name: Ensure vsce is installed
        run: |
          if ! command -v vsce &> /dev/null; then
            echo "vsce not found, installing..."
            npm install -g @vscode/vsce
          else
            echo "vsce already installed ✅"
          fi
          
      # 9️⃣ Package extension
      - name: Package extension
        run: vsce package

      # 🔟 Check if version already exists in MS Marketplace
      - name: Check if version already exists in Marketplace
        id: check_version
        run: |
          EXTENSION_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking if $EXTENSION_ID@$VERSION already exists..."

          if npx vsce show $EXTENSION_ID@$VERSION -p ${{ secrets.VS_MARKETPLACE_TOKEN }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version exists — skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "OK to publish."
          fi

      # 1️⃣1️⃣ Publish to Visual Studio Marketplace
      - name: Publish to Visual Studio Marketplace
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "Publishing to MS Marketplace..."
          set +e
          output=$(npx vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            exit 0
          fi

          if [ $exit_code -ne 0 ]; then
            exit $exit_code
          fi

      # 1️⃣2️⃣ Commit + Push Version Bump
      - name: Commit and push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch=${GITHUB_REF_NAME}
          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}" || echo "No changes"
          git push origin HEAD:$branch

      # 1️⃣3️⃣ Upload VSIX artifact
      - name: Upload packaged VSIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.bump.outputs.version }}
          path: "*.vsix"
